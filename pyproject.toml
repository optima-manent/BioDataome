[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cskl-atlas"
version = "0.4.0"
description = "Versioned incremental C-SKL pipeline and biological dataset discovery API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "BioDataome contributors" }]
license = { text = "MIT" }
keywords = ["bioinformatics", "transcriptomics", "dataset-similarity", "c-skl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "pyarrow>=17,<25",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "requests>=2.32,<3",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=5,<8", "ruff>=0.15.22,<0.16"]
specter2 = ["torch>=2.11,<3", "adapters>=1.3,<2", "transformers>=4.57.6,<4.58"]
graph = ["igraph>=1,<2"]

[project.urls]
Homepage = "https://optima-manent.github.io/BioDataome/"
Repository = "https://github.com/optima-manent/BioDataome"
Documentation = "https://github.com/optima-manent/BioDataome#readme"
Issues = "https://github.com/optima-manent/BioDataome/issues"

[project.scripts]
cskl-atlas = "cskl_atlas.cli:main"
cskl-scale = "cskl_pipeline.scale.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["cskl"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["cskl_atlas*", "cskl_pipeline*"]

[tool.setuptools.package-data]
cskl_atlas = ["CORE_ORIGIN.json"]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
addopts = "-q"
pythonpath = ["python"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# These files are preserved research/compatibility sources. Their exact hashes
# and legacy fixtures take precedence over mechanical style rewrites.
"python/cskl.py" = ["I001", "B905"]
"python/cskl_pipeline/**/*.py" = ["I001", "F401", "B905"]
"python_tests/legacy/**/*.py" = ["I001", "F401", "F841", "B905"]
