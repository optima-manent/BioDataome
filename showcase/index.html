<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore a frozen 500-study GPL570 map of calibrated c-SKL relationships, text proximity, shared samples, genes, pathways, and provenance."
    />
    <meta name="theme-color" content="#0a1524" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta property="og:title" content="C-SKL Atlas · Biological Dataset Discovery" />
    <meta
      property="og:description"
      content="An interactive evidence map of 500 biological expression datasets."
    />
    <meta property="og:type" content="website" />
    <title>C-SKL Atlas · Biological Dataset Discovery</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/showcase.css" />
  </head>
  <body>
    <div id="root">
      <main class="showcase-loading" aria-live="polite" aria-busy="true">
        <div class="showcase-primer" aria-hidden="true">
          <span class="showcase-cluster-label showcase-cluster-a">Blood studies</span>
          <span class="showcase-cluster-label showcase-cluster-b">Neural studies</span>
          <span class="showcase-link showcase-link-a"></span>
          <span class="showcase-link showcase-link-b"></span>
          <span class="showcase-dot showcase-dot-a"></span>
          <span class="showcase-dot showcase-dot-b"></span>
          <span class="showcase-dot showcase-dot-c"></span>
          <span class="showcase-dot showcase-dot-d"></span>
        </div>
        <strong>C-SKL Atlas</strong>
        <span>Preparing the published 500-study map…</span>
        <small>Color shows a grouping. Shape shows anatomical context. Lines are evidence links.</small>
      </main>
    </div>
    <noscript>This interactive graph requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
